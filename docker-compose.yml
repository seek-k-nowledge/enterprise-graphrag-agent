services:
  neo4j:
    image: neo4j:5-community
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      # Default credentials for local development. Override NEO4J_PASSWORD in .env.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-graphrag_dev_password}"
      # Install and enable the APOC plugin.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # Modest heap/page-cache defaults suitable for a dev workstation.
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./_config/neo4j/import:/import
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-graphrag_dev_password} 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: graphrag-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag_dev_password}
      PYTHONUNBUFFERED: "1"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: graphrag-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag_dev_password}
      STREAMLIT_SERVER_HEADLESS: "true"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
